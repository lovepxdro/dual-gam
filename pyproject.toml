[project]
name = "dual-gam"
version = "2.0.0-dev"
description = "ADArena — Adaptive Defense Arena"
requires-python = ">=3.11,<3.12"

dependencies = [
    "numpy==1.26.4",
    "scikit-learn==1.5.0",
    "pandas==2.2.2",
    "pyarrow==16.1.0",
    "scapy==2.5.0",
    "tqdm==4.66.4",
    "matplotlib==3.9.0",
    "torch==2.3.1",
]

[dependency-groups]
dev = [
    "pytest==8.3.5",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = [
    "h-attack",
]
testpaths = [
    "h-attack/tests",
]
