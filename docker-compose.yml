# Dual-GAM — Topologia de rede Docker
#
# Estado atual:
#   h1-h4    → hosts legítimos simplificados
#   h-attack → fonte do ataque
#   h-target → servidor alvo
#   ddos-net → bridge Docker que representa provisoriamente o plano de dados
#
# Evolução prevista:
#   substituir a bridge por Open vSwitch + Ryu e introduzir a camada de
#   controle (Traffic Monitor → Feature Extractor → Defensor → Rule Enforcer).

networks:
  ddos-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

volumes:
  models:
  logs:

services:

  # ── Servidor alvo ──────────────────────────────────────────────────────
  h-target:
    build:
      context: .
      dockerfile: docker/Dockerfile.h-target
    container_name: h-target
    networks:
      ddos-net:
        ipv4_address: 172.20.0.10
    ports:
      - "8080:80"
    restart: unless-stopped

  # ── Hosts legítimos (tráfego benigno) ─────────────────────────────────
  # Mantidos como base da futura avaliação online. Hoje ainda usam padrões
  # simples de curl em loop; na v2.0 devem gerar tráfego HTTP mais variado.
  h1:
    image: curlimages/curl:latest
    container_name: h1
    networks:
      ddos-net:
        ipv4_address: 172.20.0.21
    command: >
      sh -c "while true; do curl -s http://172.20.0.10/ > /dev/null; sleep 1; done"
    restart: unless-stopped
    depends_on: [h-target]

  h2:
    image: curlimages/curl:latest
    container_name: h2
    networks:
      ddos-net:
        ipv4_address: 172.20.0.22
    command: >
      sh -c "while true; do curl -s http://172.20.0.10/ > /dev/null; sleep 2; done"
    restart: unless-stopped
    depends_on: [h-target]

  h3:
    image: curlimages/curl:latest
    container_name: h3
    networks:
      ddos-net:
        ipv4_address: 172.20.0.23
    command: >
      sh -c "while true; do curl -s http://172.20.0.10/ > /dev/null; sleep 3; done"
    restart: unless-stopped
    depends_on: [h-target]

  h4:
    image: curlimages/curl:latest
    container_name: h4
    networks:
      ddos-net:
        ipv4_address: 172.20.0.24
    command: >
      sh -c "while true; do curl -s http://172.20.0.10/ > /dev/null; sleep 1; done"
    restart: unless-stopped
    depends_on: [h-target]

  # ── Treino offline ─────────────────────────────────────────────────────
  # O dataset é montado diretamente pelo scripts/run.sh. A rede permanece
  # definida no projeto, mas não precisa ser iniciada para o treino atual.
  h-attack-train:
    image: dual-gam-h-attack:local
    build:
      context: .
      dockerfile: docker/Dockerfile.h-attack
    container_name: h-attack-train
    volumes:
      - models:/models
      - logs:/logs
    profiles: ["train"]

  # ── Atacante real ──────────────────────────────────────────────────────
  h-attack:
    image: dual-gam-h-attack:local
    build:
      context: .
      dockerfile: docker/Dockerfile.h-attack
    container_name: h-attack
    networks:
      ddos-net:
        ipv4_address: 172.20.0.31
    volumes:
      - models:/models
      - logs:/logs
    cap_add:
      - NET_RAW
      - NET_ADMIN
    depends_on: [h-target]
    profiles: ["attack"]

  # ── Dry-run ────────────────────────────────────────────────────────────
  h-attack-dry:
    image: dual-gam-h-attack:local
    build:
      context: .
      dockerfile: docker/Dockerfile.h-attack
    container_name: h-attack-dry
    networks:
      ddos-net:
        ipv4_address: 172.20.0.32
    volumes:
      - models:/models
      - logs:/logs
    depends_on: [h-target]
    profiles: ["dry-run"]
